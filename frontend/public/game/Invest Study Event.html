<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>투자 스터디 — 옆자리의 제안</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" />
<style>
  :root {
    --bg-deep: #1a0f0a;
    --frame: #2a1a10;
    --panel: #3d2418;
    --panel-light: #5a3624;
    --ink: #f4e4cc;
    --ink-dim: #c9a888;
    --gold: #f5c542;
    --red: #ef4444;
    --green: #4ade80;
    /* 모니터(스크린) 안쪽 색 */
    --scr-bg: #e9e6d8;
    --scr-panel: #f5f3ea;
    --scr-ink: #2c2a24;
    --scr-dim: #6f6a5c;
    --scr-accent: #2f7d5b;
    --scr-line: #cfc9b6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* ===== 뷰포트 & 씬(책상 배경, 비율 고정) ===== */
  #viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #05060a;
  }
  .scene {
    position: relative;
    /* office_desk.png 원본 비율 1200 x 896 */
    aspect-ratio: 1200 / 896;
    width: min(100vw, calc(100vh * 1200 / 896));
    height: min(100vh, calc(100vw * 896 / 1200));
    background: url('assets/office_desk.png') center / 100% 100% no-repeat;
    image-rendering: pixelated;
    user-select: none;
    overflow: hidden;
  }
  /* 야근 분위기: 따뜻한 비네트 */
  .scene::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none; z-index: 40;
    background:
      radial-gradient(120% 90% at 42% 22%, rgba(255,214,140,0.10), rgba(0,0,0,0) 45%),
      radial-gradient(140% 120% at 50% 60%, rgba(0,0,0,0) 40%, rgba(6,8,16,0.55) 100%);
  }

  /* ===== 스터디 창 (모니터에 붙이지 않고, 화면 위에 뜨는 흰 창) ===== */
  /* 씬(책상 배경)은 자체 종횡비로 레터박스될 수 있으므로, vh/vw가 아니라
     씬 기준 %로 크기를 잡아야 창이 씬 밖으로 넘치지 않는다 */
  #studyOverlay { z-index: 90; }
  .study-window {
    width: min(640px, 90%);
    height: min(560px, 82%);
    display: flex; flex-direction: column;
    background: var(--bg-deep);
    border: 4px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light), inset 0 0 0 6px var(--frame), 8px 8px 0 #000;
    padding: 12px;
    image-rendering: pixelated;
    animation: studyPop 260ms steps(4, end);
  }
  @keyframes studyPop {
    from { transform: scale(0.94); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  #screen {
    position: relative;
    flex: 1 1 auto; min-height: 0; width: 100%;
    overflow: hidden;
    /* 컨테이너 쿼리 단위로 내부 콘텐츠가 창 크기에 맞춰 스케일 */
    container-type: size;
    background: #ffffff;
  }

  /* ===== 스크린 안 화면 ===== */
  .scr-app {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    font-family: 'Galmuri11', monospace;
    color: var(--scr-ink);
  }
  .scr-bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 2.5cqw;
    padding: 2.4cqh 3cqw;
    background: var(--scr-accent);
    color: #eafff4;
    border-bottom: 0.6cqh solid #24604a;
  }
  .scr-bar .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: 3.4cqh; letter-spacing: 0.4px; white-space: nowrap;
  }
  .scr-bar .sub { font-size: 3.2cqh; opacity: 0.85; margin-left: auto; white-space: nowrap; }

  .scr-body {
    flex: 1 1 auto; position: relative;
    padding: 3cqh 3.4cqw;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  .chip {
    align-self: flex-start;
    font-size: 3.2cqh; color: #eafff4; background: var(--scr-accent);
    padding: 1cqh 2.4cqw; border-radius: 0.8cqh; margin-bottom: 2cqh;
    letter-spacing: 0.5px;
  }
  .chip.hint { background: #b58318; }

  .scr-foot {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 2cqw;
    padding: 2cqh 3.4cqw 2.8cqh;
    border-top: 0.4cqh solid var(--scr-line);
  }
  .scr-btn {
    font-family: 'Galmuri11', monospace;
    font-size: 4cqh; cursor: pointer; user-select: none;
    padding: 1.6cqh 3.6cqw; border: 0.6cqh solid #24604a;
    background: var(--scr-accent); color: #eafff4;
    box-shadow: 0.6cqw 0.6cqh 0 #1d4d3b;
    white-space: nowrap;
  }
  .scr-btn:hover { filter: brightness(1.08); }
  .scr-btn:active { transform: translate(0.6cqw, 0.6cqh); box-shadow: none; }
  .scr-btn[disabled] { opacity: 0.35; cursor: default; pointer-events: none; }
  .scr-foot .spacer { margin-left: auto; }

  /* ===== 개념 문제 (1문항) ===== */
  .quiz-q { font-size: 5cqh; font-weight: 700; line-height: 1.3; margin-bottom: 2.2cqh; word-break: keep-all; }
  .quiz-opts { display: flex; flex-direction: column; gap: 1.4cqh; }
  .quiz-opt {
    font-size: 4cqh; text-align: left; cursor: pointer;
    padding: 1.5cqh 2.6cqw; background: var(--scr-panel);
    border: 0.5cqh solid var(--scr-line); color: var(--scr-ink);
    display: flex; align-items: center; gap: 2cqw; word-break: keep-all;
    font-family: 'Galmuri11', monospace;
  }
  .quiz-opt .key {
    flex: 0 0 auto; font-family: 'Press Start 2P', monospace; font-size: 3cqh;
    color: var(--scr-dim);
  }
  .quiz-opt:hover { border-color: var(--scr-accent); }
  .quiz-opt.correct { background: #d8f5e4; border-color: var(--scr-accent); color: #1d4d3b; }
  .quiz-opt.wrong { background: #fbdcdc; border-color: #d15a5a; color: #7a2a2a; }
  .quiz-opt.locked { pointer-events: none; }
  .quiz-fb { margin-top: 1.8cqh; font-size: 3.7cqh; min-height: 4cqh; word-break: keep-all; line-height: 1.4; }
  .quiz-fb.ok { color: var(--scr-accent); }
  .quiz-fb.no { color: #c0392b; }

  /* ===== 다음 투자 힌트 ===== */
  .hint-title {
    font-size: 5.6cqh; font-weight: 700; line-height: 1.25;
    margin-bottom: 1.8cqh; word-break: keep-all;
  }
  .hint-text {
    font-size: 4.4cqh; line-height: 1.5; color: #3a3830; word-break: keep-all;
  }
  .hint-note {
    margin-top: 2.2cqh; font-size: 3.7cqh; color: var(--scr-dim);
    padding-left: 3cqw; border-left: 0.8cqh solid var(--gold); line-height: 1.4;
    word-break: keep-all;
  }

  /* ===== 옆자리 동료 — 대화 UI ===== */
  #coworkerCue {
    position: absolute; right: 3%; top: 46%;
    z-index: 55; pointer-events: none;
    display: none;
    font-family: 'Galmuri11', monospace;
    text-align: center;
  }
  #coworkerCue.show { display: block; animation: cuePop 400ms steps(4, end); }
  @keyframes cuePop { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  #coworkerCue .bubble {
    font-size: clamp(18px, 2.6vw, 30px); color: var(--gold);
    text-shadow: 2px 2px 0 #000;
    animation: bob 900ms steps(2, end) infinite alternate;
  }
  @keyframes bob { to { transform: translateY(-6px); } }
  #coworkerCue .who {
    margin-top: 4px;
    font-size: clamp(10px, 1.2vw, 14px); color: var(--ink);
    background: rgba(26,15,10,0.8); border: 2px solid #000;
    box-shadow: inset 0 0 0 1px var(--panel-light);
    padding: 4px 8px; white-space: nowrap;
  }

  /* 대사창 */
  #dialogue {
    position: absolute; left: 4%; right: 4%; bottom: 4.5%;
    z-index: 60;
    background: var(--bg-deep);
    border: 4px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light), inset 0 0 0 6px var(--frame), 6px 6px 0 #000;
    padding: 20px 24px 18px;
    display: none;
  }
  #dialogue.show { display: block; }
  #dialogue .name {
    position: absolute; left: 18px; top: -16px;
    background: var(--panel); border: 3px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light);
    color: var(--gold); font-family: 'Galmuri11', monospace;
    font-size: clamp(12px, 1.5vw, 16px); letter-spacing: 1px;
    padding: 5px 14px;
  }
  #dialogue .line {
    font-family: 'Galmuri11', monospace;
    font-size: clamp(14px, 1.9vw, 21px); color: var(--ink);
    line-height: 1.75; min-height: 3.5em; word-break: keep-all;
    margin-top: 6px;
  }
  #dialogue .line .em { color: var(--gold); }
  #dialogue .next {
    position: absolute; right: 18px; bottom: 12px;
    font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--ink-dim);
    animation: bob 700ms steps(2, end) infinite alternate;
    display: none;
  }
  #dialogue.ready .next { display: block; }
  #dialogue .hint-key {
    position: absolute; right: 18px; bottom: 12px;
    font-family: 'Galmuri11', monospace; font-size: 12px; color: var(--ink-dim);
    opacity: 0.7;
  }
  #dialogue.ready .hint-key { display: none; }

  /* 선택지 (수락 / 거절) */
  #choices {
    position: absolute; left: 50%; bottom: 34%;
    transform: translateX(-50%);
    z-index: 70; display: none;
    width: min(560px, 84%);
  }
  #choices.show { display: block; animation: cuePop 300ms steps(3, end); }
  /* 밝은 모니터 위에 겹쳐도 글자가 읽히도록 어두운 판을 깔아준다 */
  #choices::before {
    content: '';
    position: absolute; inset: -18px -22px;
    background: rgba(6,8,16,0.72);
    border: 3px solid #000;
    box-shadow: inset 0 0 0 2px var(--frame);
    z-index: -1;
  }
  #choices .q {
    text-align: center; font-family: 'Galmuri11', monospace;
    font-size: clamp(13px, 1.6vw, 17px); color: var(--ink);
    text-shadow: 2px 2px 0 #000; margin-bottom: 12px;
  }
  .choice {
    display: block; width: 100%; margin-bottom: 10px;
    background: var(--panel); border: 3px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light), 4px 4px 0 #000;
    color: var(--ink); cursor: pointer;
    font-family: 'Galmuri11', monospace;
    font-size: clamp(14px, 1.8vw, 19px); letter-spacing: 1px;
    padding: 14px 18px; text-align: left;
  }
  .choice .mark { color: var(--gold); margin-right: 10px; }
  .choice .note {
    display: block; margin-top: 6px; font-size: clamp(11px, 1.2vw, 13px);
    color: var(--ink-dim); letter-spacing: 0;
  }
  .choice:hover { background: var(--panel-light); }
  .choice:active { transform: translate(3px,3px); box-shadow: inset 0 0 0 2px var(--panel-light), 1px 1px 0 #000; }
  .choice.no .mark { color: var(--ink-dim); }

  /* ===== 전체 화면 오버레이 (인트로 / 결과) ===== */
  .overlay {
    position: absolute; inset: 0; z-index: 100;
    background: rgba(6,8,16,0.72);
    display: flex; align-items: center; justify-content: center;
    padding: 4%;
  }
  .overlay[hidden] { display: none; }
  .window {
    width: 560px; max-width: 94%;
    background: var(--bg-deep);
    border: 4px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light), inset 0 0 0 6px var(--frame), 8px 8px 0 #000;
    padding: 26px 30px 30px;
    text-align: center;
    image-rendering: pixelated;
  }
  .window .tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px; color: var(--ink-dim); letter-spacing: 2px;
  }
  .window h1 {
    font-family: 'Galmuri11', monospace;
    font-size: clamp(24px, 3.4vw, 32px); color: var(--gold);
    letter-spacing: 2px; margin: 14px 0 12px;
    text-shadow: 2px 2px 0 #000; word-break: keep-all;
  }
  .window p {
    font-family: 'Galmuri11', monospace;
    font-size: clamp(13px, 1.6vw, 16px); color: var(--ink); line-height: 1.8;
    word-break: keep-all;
  }
  .window .dim { color: var(--ink-dim); font-size: 13px; }
  /* 결과창에 남는 한 줄 요약(문제 해설 또는 힌트) */
  #endNote {
    margin-top: 16px; padding: 14px 16px;
    background: var(--frame); border: 2px solid #000;
    box-shadow: inset 0 0 0 1px var(--panel-light);
    font-family: 'Galmuri11', monospace;
    font-size: clamp(12px, 1.5vw, 15px); color: var(--ink);
    line-height: 1.7; text-align: left; word-break: keep-all;
    white-space: pre-line;   /* 요약의 줄바꿈(\n)을 그대로 살린다 */
  }
  #endNote[hidden] { display: none; }
  /* 스트레스 감소 배지 (수락 시에만 등장) */
  #stressBadge {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 16px; padding: 8px 16px;
    background: rgba(74,222,128,0.14); border: 2px solid #2f7d5b;
    box-shadow: inset 0 0 0 1px rgba(74,222,128,0.25);
    font-family: 'Press Start 2P', monospace;
    font-size: 13px; color: var(--green);
  }
  #stressBadge[hidden] { display: none; }
  #stressBadge .ico { font-size: 15px; }
  .btn {
    display: inline-block; margin-top: 22px;
    background: var(--panel); border: 3px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light), 4px 4px 0 #000;
    color: var(--gold); padding: 13px 34px; cursor: pointer;
    font-family: 'Galmuri11', monospace; font-size: 18px; letter-spacing: 2px;
    text-decoration: none;
  }
  .btn.sm { padding: 9px 20px; font-size: 15px; margin: 18px 6px 0; }
  .btn.alt { color: var(--ink-dim); }
  .btn:hover { background: var(--panel-light); }
  .btn:active { transform: translate(3px,3px); box-shadow: inset 0 0 0 2px var(--panel-light), 1px 1px 0 #000; }

  #backBtn {
    position: absolute; right: 14px; top: 12px; z-index: 120;
    font-family: 'Galmuri11', monospace; font-size: 13px;
    color: var(--ink-dim); text-decoration: none;
    background: rgba(26,15,10,0.78); border: 2px solid #000;
    box-shadow: inset 0 0 0 1px var(--panel-light);
    padding: 7px 12px;
  }
  #backBtn:hover { color: var(--gold); }
</style>
</head>
<body>
<div id="viewport">
  <div class="scene" id="scene">

    <!-- 스터디 창 (수락하면 화면 위에 흰 창으로 뜬다) -->
    <div class="overlay" id="studyOverlay" hidden>
      <div class="study-window">
        <div id="screen">
          <div class="scr-app">
            <div class="scr-bar">
              <span class="logo">ANT INVEST ACADEMY</span>
              <span class="sub" id="scrSub">스터디</span>
            </div>
            <div class="scr-body" id="scrBody"></div>
            <div class="scr-foot" id="scrFoot"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 옆자리 동료 방향 표시 -->
    <div id="coworkerCue">
      <div class="bubble">💬 ▶</div>
      <div class="who" id="cueName">옆자리 · 김대리</div>
    </div>

    <!-- 대사창 -->
    <div id="dialogue">
      <div class="name" id="dlgName">김대리</div>
      <div class="line" id="dlgLine"></div>
      <div class="hint-key">클릭 / SPACE</div>
      <div class="next">▼</div>
    </div>

    <!-- 선택지 -->
    <div id="choices">
      <div class="q">어떻게 할까?</div>
      <button class="choice yes" id="acceptBtn">
        <span class="mark">▶</span>같이 해볼게요
        <span class="note">김대리가 오늘 준비한 걸 하나 알려준다.</span>
      </button>
      <button class="choice no" id="declineBtn">
        <span class="mark">▷</span>오늘은 그냥 퇴근할게요
        <span class="note">조용히 가방을 챙긴다.</span>
      </button>
    </div>

    <!-- 인트로 -->
    <div class="overlay" id="introOverlay">
      <div class="window">
        <div class="tag">EVENT · INVEST STUDY</div>
        <h1>옆자리의 제안</h1>
        <p>퇴근 시간이 지난 사무실.<br>
        옆자리 <b style="color:var(--gold)">김대리</b>가 의자를 슬쩍 굴려 다가온다.<br>
        <span class="dim">수락하면 투자 개념 문제를 풀거나,<br>다음 투자에 참고할 힌트를 얻는다.</span></p>
        <button class="btn" id="startBtn">▶ 이야기 듣기</button>
      </div>
    </div>

    <!-- 결과 -->
    <div class="overlay" id="endOverlay" hidden>
      <div class="window">
        <div class="tag" id="endTag">STUDY</div>
        <h1 id="endTitle"></h1>
        <p class="dim" id="endMsg"></p>
        <div id="stressBadge" hidden><span class="ico">🧘</span><span id="stressVal">스트레스 -0</span></div>
        <div id="endNote" hidden></div>
        <div>
          <button class="btn sm" id="retryBtn">↺ 다시</button>
          <a class="btn sm alt" href="Main Screen.html">▷ 자리 정리</a>
        </div>
      </div>
    </div>

    <a id="backBtn" href="Main Screen.html">◀ 메인으로</a>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================================
   * 콘텐츠 데이터 — 스터디 모듈로 이식할 때 이 블록만 갈아끼우면 됩니다.
   * ========================================================================= */
  var COWORKER = { name: '김대리', tag: '옆자리 · 김대리' };

  // 수락 시 둘 중 하나가 무작위로 나옴: 'quiz'(개념 문제 1개) 또는 'hint'(다음 투자 힌트)
  var QUIZ_CHANCE = 0.5;

  // 수락하면 스트레스가 줄어든다. 실제 게임 서버(eventEngine.js invest_study)의
  // 수치를 그대로 맞춰둠: 기본 -6~-12, 10% 확률로 희귀 -15. 정답 여부와 무관하게 적용.
  var STRESS_CFG = { base: { min: -12, max: -6 }, rareProb: 0.1, rare: -15 };

  function rollStressDelta() {
    if (Math.random() < STRESS_CFG.rareProb) return STRESS_CFG.rare;
    var r = STRESS_CFG.base;
    return Math.round(r.min + Math.random() * (r.max - r.min));
  }

  // 제안 대사 (선택지 전)
  var DLG_OFFER = [
    { who: '김대리', text: '아직 안 갔네? 나도 방금 끝났어.' },
    { who: '김대리', text: '있잖아… 나 요즘 <span class="em">투자 스터디</span> 하거든.\n오늘 배운 거 하나만 같이 볼래?' },
    { who: '김대리', text: '오래 안 걸려. 딱 하나만.\n아무거나 찍어서 사는 것보단 낫잖아. 어때?' }
  ];

  var DLG_ACCEPT = [
    { who: '김대리', text: '좋았어! 모니터 켜봐.' }
  ];

  var DLG_DECLINE = [
    { who: '김대리', text: '에이, 아쉽네. 뭐 오늘은 피곤하겠지.' },
    { who: '김대리', text: '다음엔 꼭 같이 하자.\n자료는 남겨둘게, 언제든 말해.' },
    { who: '나',     text: '(가방을 챙겨 사무실을 나섰다.)' }
  ];

  // --- 투자/경제 개념 문제 풀 (매번 1개만 무작위 출제) ---
  var CONCEPT_QUIZ = [
    { chip: '기초 원칙',
      q: '"계란을 한 바구니에 담지 마라"가 강조하는 원칙은?',
      opts: ['한 종목에 몰빵', '분산투자', '초단타 매매', '빚내서 투자'], answer: 1,
      okMsg: '정답! 여러 종목에 나눠 담아야 하나가 무너져도 계좌가 버팁니다.',
      noMsg: '아쉽! 위험을 나누는 "분산투자"가 정답입니다.' },
    { chip: '위험 관리',
      q: '미리 정한 손실 한계에서 감정 없이 파는 규칙은?',
      opts: ['물타기', '손절선', '존버', 'FOMO'], answer: 1,
      okMsg: '정답! 감정이 아니라 규칙이 팔게 하면 큰 손실을 막습니다.',
      noMsg: '아쉽! 미리 정한 손실 한계는 "손절선"입니다.' },
    { chip: '사기 주의',
      q: '누군가 "무위험 고수익"을 약속한다면?',
      opts: ['당장 전 재산 투자', '사기일 가능성이 높다', '대출받아 투자', '친구도 데려간다'], answer: 1,
      okMsg: '정답! 위험 없는 고수익은 없습니다. 의심하세요.',
      noMsg: '위험! 무위험 고수익은 대부분 사기입니다.' },
    { chip: '시간의 힘',
      q: '이자가 다시 이자를 낳으며 눈덩이처럼 불어나는 효과는?',
      opts: ['단리', '복리', '인플레이션', '레버리지'], answer: 1,
      okMsg: '정답! 복리는 시간이 길수록 강해집니다.',
      noMsg: '아쉽! 이자가 이자를 낳는 것은 "복리"입니다.' },
    { chip: '거시 경제',
      q: '기준금리가 오르면 일반적으로 나타나는 현상은?',
      opts: ['대출 이자 부담이 커진다', '예금 이자가 사라진다', '물가가 반드시 오른다', '주가가 항상 오른다'], answer: 0,
      okMsg: '정답! 금리가 오르면 빚의 무게가 무거워집니다.',
      noMsg: '아쉽! 금리 인상은 대출 이자 부담을 키웁니다.' },
    { chip: '거시 경제',
      q: '물가가 올라 돈의 가치가 떨어지는 현상은?',
      opts: ['디플레이션', '인플레이션', '스프레드', '리밸런싱'], answer: 1,
      okMsg: '정답! 현금만 쥐고 있어도 가치가 줄어들 수 있습니다.',
      noMsg: '아쉽! 물가 상승은 "인플레이션"입니다.' },
    { chip: '매매 습관',
      q: '"남들 다 벌었대"라는 소문에 뒤늦게 뛰어드는 심리는?',
      opts: ['FOMO', '손절', '분산', '복리'], answer: 0,
      okMsg: '정답! 조급함이 개미의 가장 큰 적입니다.',
      noMsg: '아쉽! 놓칠까 두려워 뛰어드는 심리가 "FOMO"입니다.' }
  ];

  // --- 다음 투자 힌트 풀 (매번 1개만 무작위 제공) ---
  // 실제 게임에 붙일 때는 engine이 넘겨주는 시장 상황 기반 힌트로 교체하세요.
  var INVEST_HINTS = [
    { title: '현금도 전략이다',
      text: '전부 투자해두면 기회가 와도 살 돈이 없다. 기다릴 실탄, 즉 현금 비중을 남겨두자.',
      note: '쉬는 것도 투자다.' },
    { title: '한 번에 담지 마',
      text: '살 종목을 정했어도 자금을 나눠서 사자. 값이 흔들려도 평단가를 다스릴 수 있다.',
      note: '한 방을 노리면 한 방에 간다.' },
    { title: '뉴스는 이미 늦다',
      text: '모두가 아는 호재는 이미 가격에 반영돼 있다. 기사 제목만 보고 뛰어드는 건 위험하다.',
      note: '소문에 사서 뉴스에 판다.' },
    { title: '빚투는 최후의 수단',
      text: '빌린 돈으로 산 종목이 흔들리면 버틸 시간이 없다. 이자는 하락장에도 꼬박꼬박 나간다.',
      note: '살아남아야 다음 기회가 있다.' },
    { title: '급등에는 이유를 물어라',
      text: '이유 없이 튀어오른 종목은 이유 없이 떨어진다. 남들이 달릴 때 한 박자 늦춰보자.',
      note: '못 먹은 수익엔 세금이 없다.' },
    { title: '금리를 먼저 봐라',
      text: '금리가 오르는 국면에선 빚이 무거워지고 위험자산은 힘을 잃기 쉽다. 판을 먼저 읽자.',
      note: '개별 종목보다 큰 흐름.' }
  ];

  var TYPE_SPEED = 26;   // 타자 연출 ms/글자

  /* =========================================================================
   * 엘리먼트 / 상태
   * ========================================================================= */
  var studyOverlay = document.getElementById('studyOverlay');
  var scrSub = document.getElementById('scrSub');
  var scrBody = document.getElementById('scrBody');
  var scrFoot = document.getElementById('scrFoot');

  var dialogue = document.getElementById('dialogue');
  var dlgName = document.getElementById('dlgName');
  var dlgLine = document.getElementById('dlgLine');
  var choices = document.getElementById('choices');
  var cue = document.getElementById('coworkerCue');

  var script = [], lineIdx = 0, typing = false, typeTimer = null;
  var onScriptEnd = null, dialogueActive = false;

  var mode = null;        // 'quiz' | 'hint'
  var current = null;     // 이번에 뽑힌 문제 또는 힌트
  var answeredOk = false;
  var stressDelta = 0;    // 이번 수락으로 줄어든 스트레스 (거절 시 0)

  document.getElementById('cueName').textContent = COWORKER.tag;

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;';
    });
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  /* =========================================================================
   * 대사 재생 (타자 연출 + 클릭/스페이스로 진행)
   * ========================================================================= */
  // 대사에는 <span class="em">만 허용하므로, 이스케이프 후 해당 태그만 되살린다.
  function renderRich(text) {
    return esc(text)
      .replace(/&lt;span class="em"&gt;/g, '<span class="em">')
      .replace(/&lt;\/span&gt;/g, '</span>')
      .replace(/\n/g, '<br>');
  }

  function playScript(lines, done) {
    script = lines; lineIdx = 0; onScriptEnd = done || null;
    dialogueActive = true;
    dialogue.classList.add('show');
    cue.classList.add('show');
    showLine();
  }

  function showLine() {
    var item = script[lineIdx];
    dlgName.textContent = item.who;
    dialogue.classList.remove('ready');

    var full = renderRich(item.text);
    var plain = item.text.replace(/<[^>]*>/g, '');
    var shown = 0;
    typing = true;
    clearInterval(typeTimer);

    dlgLine.innerHTML = '';
    typeTimer = setInterval(function () {
      shown++;
      dlgLine.innerHTML = renderRich(sliceKeepTags(item.text, shown));
      if (shown >= plain.length) {
        clearInterval(typeTimer);
        typing = false;
        dlgLine.innerHTML = full;
        dialogue.classList.add('ready');
      }
    }, TYPE_SPEED);
  }

  // 태그를 유지한 채 '보이는 글자' 기준으로 n개까지 자른다 (열린 태그는 닫아줌)
  function sliceKeepTags(src, n) {
    var out = '', count = 0, i = 0, open = [];
    while (i < src.length && count < n) {
      if (src[i] === '<') {
        var close = src.indexOf('>', i);
        if (close === -1) break;
        var tag = src.slice(i, close + 1);
        out += tag;
        if (/^<\//.test(tag)) open.pop(); else open.push(tag);
        i = close + 1;
        continue;
      }
      out += src[i]; count++; i++;
    }
    while (open.length) { open.pop(); out += '</span>'; }
    return out;
  }

  function advance() {
    if (!dialogueActive) return;
    if (typing) {                     // 타자 중이면 즉시 완성
      clearInterval(typeTimer);
      typing = false;
      dlgLine.innerHTML = renderRich(script[lineIdx].text);
      dialogue.classList.add('ready');
      return;
    }
    lineIdx++;
    if (lineIdx < script.length) {
      showLine();
    } else {
      dialogueActive = false;
      dialogue.classList.remove('show', 'ready');
      if (onScriptEnd) { var fn = onScriptEnd; onScriptEnd = null; fn(); }
    }
  }

  dialogue.addEventListener('click', advance);
  document.addEventListener('keydown', function (e) {
    if ((e.key === ' ' || e.key === 'Enter') && dialogueActive) { e.preventDefault(); advance(); }
  });

  /* =========================================================================
   * 흐름: 제안 → 선택 → (수락) 문제 or 힌트 / (거절) 종료
   * ========================================================================= */
  function startEvent() {
    document.getElementById('introOverlay').hidden = true;
    playScript(DLG_OFFER, showChoices);
  }

  function showChoices() { choices.classList.add('show'); }

  function accept() {
    choices.classList.remove('show');
    playScript(DLG_ACCEPT, function () {
      cue.classList.remove('show');
      studyOverlay.hidden = false;                 // 스터디 창이 화면 위에 뜬다
      // 참여 자체로 스트레스가 줄어든다 (정답 여부와 무관, 실제 서버 로직과 동일)
      stressDelta = rollStressDelta();
      mode = Math.random() < QUIZ_CHANCE ? 'quiz' : 'hint';
      setTimeout(mode === 'quiz' ? renderQuiz : renderHint, 220);
    });
  }

  function decline() {
    choices.classList.remove('show');
    playScript(DLG_DECLINE, function () {
      cue.classList.remove('show');
      finishDecline();
    });
  }

  document.getElementById('startBtn').addEventListener('click', startEvent);
  document.getElementById('acceptBtn').addEventListener('click', accept);
  document.getElementById('declineBtn').addEventListener('click', decline);

  /* =========================================================================
   * 모니터 화면 — 개념 문제 1개
   * ========================================================================= */
  function renderQuiz() {
    current = pick(CONCEPT_QUIZ);
    answeredOk = false;
    scrSub.textContent = '오늘의 개념';

    var keys = ['A', 'B', 'C', 'D'];
    var optsHtml = current.opts.map(function (o, i) {
      return '<button class="quiz-opt" data-i="' + i + '">' +
        '<span class="key">' + keys[i] + '</span>' + esc(o) + '</button>';
    }).join('');

    scrBody.innerHTML =
      '<span class="chip">' + esc(current.chip) + '</span>' +
      '<div class="quiz-q">' + esc(current.q) + '</div>' +
      '<div class="quiz-opts">' + optsHtml + '</div>' +
      '<div class="quiz-fb" id="quizFb"></div>';

    scrFoot.innerHTML =
      '<span class="spacer"></span>' +
      '<button class="scr-btn" id="doneBtn" disabled>마치기 ▶</button>';

    var answered = false;
    var opts = scrBody.querySelectorAll('.quiz-opt');
    opts.forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (answered) return;
        answered = true;
        var pickIdx = parseInt(btn.getAttribute('data-i'), 10);
        var fb = document.getElementById('quizFb');
        opts.forEach(function (b) {
          b.classList.add('locked');
          if (parseInt(b.getAttribute('data-i'), 10) === current.answer) b.classList.add('correct');
        });
        if (pickIdx === current.answer) {
          answeredOk = true;
          fb.className = 'quiz-fb ok';
          fb.textContent = '⭕ ' + current.okMsg;
        } else {
          btn.classList.add('wrong');
          fb.className = 'quiz-fb no';
          fb.textContent = '❌ ' + current.noMsg;
        }
        document.getElementById('doneBtn').removeAttribute('disabled');
      });
    });

    document.getElementById('doneBtn').addEventListener('click', finishQuiz);
  }

  /* =========================================================================
   * 모니터 화면 — 다음 투자 힌트
   * ========================================================================= */
  function renderHint() {
    current = pick(INVEST_HINTS);
    scrSub.textContent = '오늘의 힌트';

    scrBody.innerHTML =
      '<span class="chip hint">다음 투자 힌트</span>' +
      '<div class="hint-title">' + esc(current.title) + '</div>' +
      '<div class="hint-text">' + esc(current.text) + '</div>' +
      (current.note ? '<div class="hint-note">💡 ' + esc(current.note) + '</div>' : '');

    scrFoot.innerHTML =
      '<span class="spacer"></span>' +
      '<button class="scr-btn" id="doneBtn">마치기 ▶</button>';

    document.getElementById('doneBtn').addEventListener('click', finishHint);
  }

  /* =========================================================================
   * 결과
   * ========================================================================= */
  function showEnd(tag, title, msg, note, stress) {
    document.getElementById('endTag').textContent = tag;
    document.getElementById('endTitle').textContent = title;
    document.getElementById('endMsg').textContent = msg;
    var noteEl = document.getElementById('endNote');
    if (note) { noteEl.textContent = note; noteEl.hidden = false; }
    else { noteEl.hidden = true; }

    var badge = document.getElementById('stressBadge');
    if (stress) {
      document.getElementById('stressVal').textContent = '스트레스 ' + stress;
      badge.hidden = false;
    } else {
      badge.hidden = true;
    }
    document.getElementById('endOverlay').hidden = false;
  }

  function finishQuiz() {
    showEnd(
      'STUDY COMPLETE',
      answeredOk ? '정답이다!' : '틀렸다…',
      answeredOk
        ? COWORKER.name + '가 엄지를 들어 보였다.'
        : COWORKER.name + '가 웃으며 다시 설명해줬다.',
      current.q + '\n→ ' + current.opts[current.answer],
      stressDelta
    );
    emit({ accepted: true, mode: 'quiz', correct: answeredOk, stressDelta: stressDelta });
  }

  function finishHint() {
    showEnd(
      'STUDY COMPLETE',
      '힌트를 얻었다',
      COWORKER.name + '의 조언을 수첩에 적어뒀다.',
      current.title + '\n→ ' + current.note,
      stressDelta
    );
    emit({ accepted: true, mode: 'hint', hint: current.title, stressDelta: stressDelta });
  }

  function finishDecline() {
    showEnd(
      'STUDY DECLINED',
      '제안을 거절했다',
      COWORKER.name + '의 자료는 아직 남아 있다. 다음 기회에 다시 물어보자.',
      null,
      0
    );
    document.getElementById('retryBtn').textContent = '↺ 다시 생각하기';
    emit({ accepted: false, mode: null, stressDelta: 0 });
  }

  // === 게임 이식 훅 ===
  // 스터디 모듈에 붙일 때 결과를 부모/엔진으로 전달하세요.
  // stressDelta는 음수(감소)이며, 실제 게임에서는 session.stress += stressDelta 로 반영하면 됩니다.
  function emit(payload) {
    // window.parent.postMessage(Object.assign({ type: 'invest_study_done' }, payload), '*');
  }

  function retry() {
    document.getElementById('endOverlay').hidden = true;
    document.getElementById('retryBtn').textContent = '↺ 다시';
    studyOverlay.hidden = true;
    scrBody.innerHTML = ''; scrFoot.innerHTML = '';
    mode = null; current = null; answeredOk = false; stressDelta = 0;
    playScript(DLG_OFFER, showChoices);   // 제안 장면부터 다시
  }

  document.getElementById('retryBtn').addEventListener('click', retry);
})();
</script>
