<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>미니게임 1 — 왝슨을 잡아라 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" />
<style>
  :root {
    --bg-deep: #1a0f0a;
    --frame: #2a1a10;
    --panel: #3d2418;
    --panel-light: #5a3624;
    --ink: #f4e4cc;
    --ink-dim: #c9a888;
    --gold: #f5c542;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* ===== 게임 스테이지 ===== */
  #stage {
    position: relative; width: 100%; height: 100%;
    /* 배경 상단에 SCORE/TIME 밴드가 그려져 있어 100%/100%로 늘려 위치를 고정하고,
       실제 값은 같은 자리(#hud)에 얹어 표시한다 */
    background: url('assets/boong_bg.png') no-repeat;
    background-size: 100% 100%;
    image-rendering: pixelated;
    cursor: crosshair;
    user-select: none;
  }

  /* ===== HUD (배경에 박힌 SCORE: 0000 / TIME: 60 밴드를 실시간 값으로 덮음) ===== */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    height: 6.4%;
    background: #000;
    display: flex; justify-content: space-between; align-items: center;
    gap: 3%;
    padding: 0 2.2%;
    z-index: 500;
    pointer-events: none;
  }
  #hud .txt {
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    font-size: clamp(14px, 2.6vh, 28px);
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #333;
    white-space: nowrap;
  }
  /* 가로 타이머 바 — 남은 시간이 실시간으로 줄어드는 게 보임 */
  #timerBar {
    flex: 1; max-width: 46%;
    height: 46%;
    border: 3px solid #fff;
    box-shadow: 2px 2px 0 #333;
    background: #1a0f0a;
    padding: 3px;
  }
  #timerFill {
    height: 100%; width: 100%;
    background: var(--gold);
    transition: none;
  }
  #timerFill.danger { background: #ef4444; }

  /* ===== 새 (왝슨) ===== */
  .bird {
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated;
    will-change: transform;
    cursor: crosshair;
    -webkit-user-drag: none;
  }
  .bird.caught {
    transition: transform 320ms steps(6, end), opacity 320ms steps(6, end);
    opacity: 0 !important;
    pointer-events: none;
  }

  /* 포획 점수 플로터 */
  .floater {
    position: absolute;
    font-family: 'Press Start 2P', monospace;
    font-size: 16px; color: var(--gold);
    text-shadow: 2px 2px 0 #000;
    pointer-events: none; z-index: 600;
    animation: floatUp 700ms steps(7, end) forwards;
  }
  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to   { transform: translateY(-46px); opacity: 0; }
  }
  /* 빗나감 표시 */
  .missfx {
    position: absolute; width: 18px; height: 18px;
    border: 3px solid rgba(244,228,204,0.65);
    transform: translate(-50%,-50%);
    pointer-events: none; z-index: 550;
    animation: missPop 260ms steps(4, end) forwards;
  }
  @keyframes missPop { from { opacity: 1; } to { opacity: 0; transform: translate(-50%,-50%) scale(1.8); } }

  /* ===== 오버레이 (시작/종료) ===== */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.66);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .overlay[hidden] { display: none; }
  .window {
    width: 560px; max-width: 92%;
    background: var(--bg-deep);
    border: 4px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light), inset 0 0 0 6px var(--frame), 8px 8px 0 #000;
    padding: 26px 30px 30px;
    text-align: center;
    image-rendering: pixelated;
  }
  .window .mini-tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px; color: var(--ink-dim); letter-spacing: 2px;
  }
  .window h1 {
    font-family: 'Galmuri11', monospace;
    font-size: 30px; color: var(--gold);
    letter-spacing: 2px; margin: 12px 0 14px;
    text-shadow: 2px 2px 0 #000;
  }
  .window p {
    font-family: 'Galmuri11', monospace;
    font-size: 15px; color: var(--ink); line-height: 1.8;
  }
  .window .dim { color: var(--ink-dim); font-size: 13px; }
  .btn {
    display: inline-block; margin-top: 22px;
    background: var(--panel); border: 3px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light), 4px 4px 0 #000;
    color: var(--gold); padding: 13px 34px; cursor: pointer;
    font-family: 'Galmuri11', monospace; font-size: 18px; letter-spacing: 2px;
  }
  .btn:hover { background: var(--panel-light); }
  .btn:active { transform: translate(3px,3px); box-shadow: inset 0 0 0 2px var(--panel-light), 1px 1px 0 #000; }
  .result-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    margin: 18px 0 4px;
  }
  .result-cell {
    background: var(--frame); border: 2px solid #000;
    box-shadow: inset 0 0 0 1px var(--panel-light);
    padding: 12px 6px;
  }
  .result-cell .l { font-family: 'Galmuri11', monospace; font-size: 12px; color: var(--ink-dim); }
  .result-cell .v { font-family: 'Press Start 2P', monospace; font-size: 16px; color: var(--gold); margin-top: 8px; }

  /* 메인으로 돌아가기 */
  #backBtn {
    position: absolute; right: 14px; bottom: 12px; z-index: 900;
    font-family: 'Galmuri11', monospace; font-size: 13px;
    color: var(--ink-dim); text-decoration: none;
    background: rgba(26,15,10,0.75); border: 2px solid #000;
    box-shadow: inset 0 0 0 1px var(--panel-light);
    padding: 7px 12px;
  }
  #backBtn:hover { color: var(--gold); }

  /* ===== 게임방법(체험형 튜토리얼) ===== */
  .btn-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .btn-row .btn { padding: 12px 20px; font-size: 16px; }
  .btn.sub { color: var(--ink); }
  .btn[hidden] { display: none; }
  .tut-ui[hidden] { display: none !important; }
  #tutBubble {
    position: absolute; left: 50%; top: 9%; transform: translateX(-50%);
    z-index: 800; width: max-content; max-width: 86%;
    background: var(--bg-deep); border: 4px solid #000;
    box-shadow: inset 0 0 0 2px var(--panel-light), inset 0 0 0 6px var(--frame), 6px 6px 0 #000;
    padding: 12px 22px; text-align: center; pointer-events: none;
    font-family: 'Galmuri11', monospace; color: var(--ink); font-size: 15px; line-height: 1.7;
  }
  #tutBubble .step { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--ink-dim); letter-spacing: 2px; display: block; margin-bottom: 4px; }
  #tutBubble .sub { font-size: 13px; color: var(--ink-dim); }
  #tutBubble b { color: var(--gold); }
  #tutBubble.ok { box-shadow: inset 0 0 0 2px #4ade80, inset 0 0 0 6px var(--frame), 6px 6px 0 #000; }
  #tutHand {
    position: absolute; left: 0; top: 0; z-index: 790; pointer-events: none;
    font-size: 34px; line-height: 1; filter: drop-shadow(2px 2px 0 #000);
  }
  #tutHand span { display: block; animation: handTap 700ms steps(2, end) infinite; }
  @keyframes handTap { 50% { transform: translate(-5px, -7px); } }
  #tutTarget {
    position: absolute; left: 50%; top: 60%; width: 70px; height: 70px; z-index: 780;
    transform: translate(-50%, -50%); pointer-events: none;
    border: 3px dashed rgba(244,228,204,0.8); border-radius: 50%;
    animation: targetPulse 900ms steps(3, end) infinite;
  }
  @keyframes targetPulse { 50% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.5; } }
  #tutSkip {
    position: absolute; right: 14px; bottom: 12px; z-index: 900; cursor: pointer;
    font-family: 'Galmuri11', monospace; font-size: 13px; color: var(--ink-dim);
    background: rgba(26,15,10,0.85); border: 2px solid #000;
    box-shadow: inset 0 0 0 1px var(--panel-light); padding: 7px 12px;
  }
  #tutSkip:hover { color: var(--gold); }
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <span class="txt">SCORE: <span id="hudScore">0000</span></span>
    <div id="timerBar" aria-label="남은 시간">
      <div id="timerFill"></div>
    </div>
    <span class="txt">TIME: <span id="hudTime">5</span></span>
  </div>

  <a id="backBtn" href="Main Screen.html">◀ 메인으로</a>

  <!-- 시작 오버레이 -->
  <div class="overlay" id="startOverlay">
    <div class="window">
      <div class="mini-tag">MINIGAME 01</div>
      <h1>왝슨을 잡아라!</h1>
      <p>연못 위를 날아다니는 <b style="color:var(--gold)">왝슨</b>을 클릭해서 포획하세요.</p>
      <p class="dim">작고 빠른 왝슨일수록 점수가 높습니다 · 제한시간 5초</p>
      <div class="btn-row">
        <button class="btn sub" id="howtoBtn">? 게임방법</button>
        <button class="btn" id="startBtn">▶ 게임 시작</button>
      </div>
    </div>
  </div>

  <!-- 게임방법: 체험 중 안내 UI -->
  <div id="tutBubble" class="tut-ui" hidden></div>
  <div id="tutHand" class="tut-ui" hidden><span>👆</span></div>
  <div id="tutTarget" class="tut-ui" hidden></div>
  <button id="tutSkip" class="tut-ui" hidden>건너뛰기 ≫</button>

  <!-- 게임방법: 마무리 오버레이 -->
  <div class="overlay" id="tutEndOverlay" hidden>
    <div class="window">
      <div class="mini-tag">HOW TO PLAY</div>
      <h1>이제 실전이다!</h1>
      <p>실전은 <b style="color:var(--gold)">5초</b> 동안 9마리가 빠르게 날아다닌다.<br>최대한 많이 잡아라!</p>
      <p class="dim">일당은 잡은 마리 수로 정해진다 · 허공을 눌러도 감점은 없다</p>
      <div class="btn-row">
        <button class="btn sub" id="tutAgainBtn">↺ 다시 보기</button>
        <button class="btn sub" id="tutHomeBtn">◀ 처음 화면</button>
        <button class="btn" id="tutStartBtn">▶ 게임 시작</button>
      </div>
    </div>
  </div>

  <!-- 종료 오버레이 -->
  <div class="overlay" id="endOverlay" hidden>
    <div class="window">
      <div class="mini-tag">TIME OVER</div>
      <h1 id="endTitle">포획 종료!</h1>
      <div class="result-grid">
        <div class="result-cell"><div class="l">포획</div><div class="v" id="rCaught">0</div></div>
        <div class="result-cell"><div class="l">점수</div><div class="v" id="rScore">0</div></div>
        <div class="result-cell"><div class="l">명중률</div><div class="v" id="rAcc">0%</div></div>
      </div>
      <p class="dim" id="rankMsg"></p>
      <button class="btn" id="retryBtn">↺ 다시 도전</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // --- 부업 임베드 연동 (React 앱이 iframe으로 열었을 때만 동작; 단독 실행에는 영향 없음) ---
  var EMBEDDED = (function () { try { return window.parent && window.parent !== window; } catch (_) { return false; } })();
  if (EMBEDDED) { var _bb = document.getElementById('backBtn'); if (_bb) _bb.style.display = 'none'; }
  function postScore(rawScore) {
    if (!EMBEDDED) return;
    try { window.parent.postMessage({ source: 'antsurvival-minigame', game: 'catch_waxon', rawScore: rawScore }, '*'); } catch (_) {}
  }

  // ?howto=only : 튜토리얼에서 연 경우. 게임방법만 볼 수 있고 실제 플레이(점수 제출)는 막는다.
  var HOWTO_ONLY = /[?&]howto=only\b/.test(location.search);
  if (HOWTO_ONLY) {
    document.getElementById('startBtn').hidden = true;
    document.getElementById('tutStartBtn').hidden = true;
  }

  var GAME_SECONDS = 5;      // 제한시간 5초
  var MAX_BIRDS = 9;          // 동시에 떠다니는 왝슨 수
  var MIN_SIZE = 42, MAX_SIZE = 110;

  var stage = document.getElementById('stage');
  var hudScore = document.getElementById('hudScore');
  var hudTime = document.getElementById('hudTime');
  var timerFill = document.getElementById('timerFill');

  // { el, x, y, vx, vy, speed, size, amp, freq, phase, curveAmp, curveFreq, phase2, tiltAmp, tiltFreq, phase3, t, alive }
  var birds = [];
  var score = 0, caught = 0, misses = 0;
  var timeLeft = GAME_SECONDS;
  var playing = false;
  var loopId = null, lastTs = 0, startTs = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function normalize(dx, dy) {
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: dx / len, y: dy / len };
  }

  // ---- 새 생성: 좌우 75%, 위아래 25%. 단, 궤적은 직선이 아니라 새처럼 살짝 흔들리게 설정 ----
  function spawnBird() {
    var size = Math.round(rand(MIN_SIZE, MAX_SIZE));
    var W = stage.clientWidth, H = stage.clientHeight;
    var hudH = H * 0.064;
    var minY = hudH + 10;
    var maxY = H - size - 20;
    var minX = 0;
    var maxX = W - size;

    // 방향 비율: 좌우 이동 75%, 위아래 이동 25%
    // 0:왼쪽→오른쪽, 1:오른쪽→왼쪽, 2:위→아래, 3:아래→위
    var edgeRoll = Math.random();
    var edge = edgeRoll < 0.75
      ? (Math.random() < 0.5 ? 0 : 1)
      : (Math.random() < 0.5 ? 2 : 3);

    var startX, startY, targetX, targetY;
    if (edge === 0) {
      startX = -size - 40;
      startY = rand(minY, maxY);
      targetX = W + size + 40;
      // 가로 이동이 많지만 완전 수평선은 아니게, 완만한 높이 변화 부여
      targetY = clamp(startY + rand(-H * 0.30, H * 0.30), minY, maxY);
    } else if (edge === 1) {
      startX = W + size + 40;
      startY = rand(minY, maxY);
      targetX = -size - 40;
      targetY = clamp(startY + rand(-H * 0.30, H * 0.30), minY, maxY);
    } else if (edge === 2) {
      startX = rand(minX, maxX);
      startY = hudH - size - 40;
      // 위아래 이동도 살짝 비스듬히 흐르게 해서 일직선 느낌 감소
      targetX = clamp(startX + rand(-W * 0.34, W * 0.34), minX, maxX);
      targetY = H + size + 40;
    } else {
      startX = rand(minX, maxX);
      startY = H + size + 40;
      targetX = clamp(startX + rand(-W * 0.34, W * 0.34), minX, maxX);
      targetY = hudH - size - 40;
    }

    var dir = normalize(targetX - startX, targetY - startY);
    var speed = rand(430, 860) * (0.85 + (size / MAX_SIZE) * 0.35);
    return createBird(size, startX, startY, dir, speed, edge < 2);
  }

  // 왝슨 1마리 생성 (본게임/게임방법 공용). dir = 단위 방향벡터
  function createBird(size, startX, startY, dir, speed, horizontal) {
    var el = document.createElement('img');
    el.src = 'assets/bird.png';
    el.className = 'bird';
    el.draggable = false;
    el.style.width = size + 'px';
    el.style.zIndex = 100 + size;

    var b = {
      el: el,
      size: size,
      x: startX,
      y: startY,
      vx: dir.x * speed,
      vy: dir.y * speed,
      speed: speed,
      // 빠른 날갯짓처럼 작은 흔들림 + 큰 곡선 흔들림을 같이 사용
      amp: rand(8, 26),
      freq: rand(4.0, 7.5),
      phase: rand(0, Math.PI * 2),
      curveAmp: horizontal ? rand(18, 48) : rand(16, 40),
      curveFreq: rand(0.75, 1.55),
      phase2: rand(0, Math.PI * 2),
      tiltAmp: rand(4, 10),
      tiltFreq: rand(2.0, 4.4),
      phase3: rand(0, Math.PI * 2),
      t: 0,
      alive: true
    };

    el.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      if (!b.alive) return;
      if (playing) catchBird(b, e.clientX, e.clientY);
      else if (tut.active) tutCatch(b, e.clientX, e.clientY);
    });

    stage.appendChild(el);
    birds.push(b);
    draw(b);
    return b;
  }

  function draw(b) {
    // 진행 방향에 수직인 방향으로 작은 날갯짓 흔들림 + 큰 곡선 흔들림을 합쳐 자연스러운 비행 궤적 생성
    var wingWobble = Math.sin(b.t * b.freq + b.phase) * b.amp;
    var curveWobble = Math.sin(b.t * b.curveFreq + b.phase2) * b.curveAmp;
    var nx = -b.vy / b.speed;
    var ny = b.vx / b.speed;
    var drawX = b.x + nx * (wingWobble + curveWobble);
    var drawY = b.y + ny * (wingWobble + curveWobble);

    // 새가 날아가며 몸을 살짝 기울이는 느낌
    var tilt = clamp((b.vy / b.speed) * 18 + Math.sin(b.t * b.tiltFreq + b.phase3) * b.tiltAmp, -18, 18);

    // bird.png 원본이 왼쪽을 보고 있음 → 오른쪽으로 이동할 때 좌우 반전
    var flip = b.vx > 0 ? ' scaleX(-1)' : '';
    b.el.style.transform = 'translate(' + drawX + 'px,' + drawY + 'px)' + flip + ' rotate(' + tilt + 'deg)';
  }

  function removeBird(b) {
    b.alive = false;
    if (b.el.parentNode) b.el.parentNode.removeChild(b.el);
    var i = birds.indexOf(b);
    if (i >= 0) birds.splice(i, 1);
  }

  // ---- 포획 ----
  function catchBird(b, cx, cy) {
    b.alive = false;
    caught += 1;
    // 작은(먼) 왝슨일수록 고득점: 3단계
    var pts = b.size < 66 ? 200 : (b.size < 90 ? 150 : 100);
    score += pts;
    updateHud();

    b.el.classList.add('caught');
    b.el.style.transform += ' rotate(540deg) scale(0.1)';
    setTimeout(function () { removeBird(b); }, 330);

    var f = document.createElement('div');
    f.className = 'floater';
    f.textContent = '+' + pts;
    f.style.left = (cx - 20) + 'px';
    f.style.top = (cy - 30) + 'px';
    stage.appendChild(f);
    setTimeout(function () { f.remove(); }, 720);
  }

  // ---- 빗나감 ----
  stage.addEventListener('pointerdown', function (e) {
    if (tut.active) {
      if (e.target.closest('.overlay, #tutSkip')) return;
      showMiss(e.clientX, e.clientY);
      tutMiss();
      return;
    }
    if (!playing) return;
    misses += 1;
    showMiss(e.clientX, e.clientY);
  });

  function showMiss(cx, cy) {
    var m = document.createElement('div');
    m.className = 'missfx';
    m.style.left = cx + 'px';
    m.style.top = cy + 'px';
    stage.appendChild(m);
    setTimeout(function () { m.remove(); }, 280);
  }

  // ---- 루프 ----
  function tick() {
    if (!playing) return;
    var ts = performance.now();
    var dt = Math.min(50, ts - lastTs) / 1000;  // 탭 전환 등 점프 방지
    lastTs = ts;

    var elapsed = (ts - startTs) / 1000;
    var remaining = Math.max(0, GAME_SECONDS - elapsed);

    var W = stage.clientWidth, H = stage.clientHeight;
    var hudH = H * 0.064;
    for (var i = birds.length - 1; i >= 0; i--) {
      var b = birds[i];
      if (!b.alive) continue;
      b.t += dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      draw(b);

      // 어느 방향으로든 화면 밖으로 완전히 벗어나면 제거
      if (b.x > W + b.size * 2 || b.x < -b.size * 2 ||
          b.y > H + b.size * 2 || b.y < hudH - b.size * 2) {
        removeBird(b);
      }
    }

    while (birds.length < MAX_BIRDS) spawnBird();

    timeLeft = Math.ceil(remaining);
    updateHud(remaining);

    if (remaining <= 0) end();
  }

  function updateHud(remainingSeconds) {
    var remaining = typeof remainingSeconds === 'number' ? remainingSeconds : timeLeft;
    var pct = clamp(remaining / GAME_SECONDS, 0, 1) * 100;

    hudScore.textContent = String(score).padStart(4, '0');
    hudTime.textContent = Math.ceil(clamp(remaining, 0, GAME_SECONDS));
    timerFill.style.width = pct + '%';
    timerFill.classList.toggle('danger', pct <= 30);
  }

  // ---- 시작 / 종료 ----
  function start() {
    if (HOWTO_ONLY) return;
    tutStop();
    // 초기화
    birds.slice().forEach(removeBird);
    score = 0; caught = 0; misses = 0; timeLeft = GAME_SECONDS;
    updateHud(GAME_SECONDS);
    document.getElementById('startOverlay').hidden = true;
    document.getElementById('endOverlay').hidden = true;

    playing = true;
    for (var i = 0; i < MAX_BIRDS; i++) spawnBird();

    // 초반부터 화면에 골고루 보이도록 일부는 화면 안쪽에서 시작
    birds.forEach(function (b, idx) {
      if (idx % 2 === 0) {
        b.x = rand(0, stage.clientWidth - b.size);
        b.y = rand(stage.clientHeight * 0.12, stage.clientHeight - b.size);
      }
      draw(b);
    });

    startTs = performance.now();
    lastTs = startTs;
    clearInterval(loopId);
    loopId = setInterval(tick, 1000 / 60);
  }

  function end() {
    if (!playing) return;
    playing = false;
    clearInterval(loopId);
    updateHud(0);

    var shots = caught + misses;
    var acc = shots ? Math.round(caught / shots * 100) : 0;
    document.getElementById('rCaught').textContent = caught + '마리';
    document.getElementById('rScore').textContent = String(score).padStart(4, '0');
    document.getElementById('rAcc').textContent = acc + '%';
    var msg = caught >= 18 ? '왝슨 마스터! 짧은 시간 안에 엄청 잡았습니다.'
            : caught >= 10 ? '숙련된 사냥꾼이군요.'
            : caught >= 5  ? '견습 포획꾼. 조금 더 연습하세요.'
            : '…왝슨이 비웃으며 날아갑니다.';
    document.getElementById('rankMsg').textContent = msg;
    document.getElementById('endOverlay').hidden = false;
    postScore(caught);   // 원점수 = 포획 수 (서버 SCORE_CUTS.catch_waxon 기준)
  }

  // =====================================================================
  // 게임방법 (체험형 튜토리얼) — 실제 화면에서 직접 클릭해 보며 익힌다.
  // 타이머 정지, 느린 왝슨, 점수는 서버로 보내지 않는다(postScore 미호출).
  // ① 1마리 잡기 → ② 크기별 3마리 잡기(작을수록 고득점) → ③ 허공 클릭(감점 없음) → 마무리
  // =====================================================================
  var tut = { active: false, step: 0, loopId: null, lastTs: 0, timers: [] };
  var tutBubble = document.getElementById('tutBubble');
  var tutHand = document.getElementById('tutHand');
  var tutTarget = document.getElementById('tutTarget');
  var tutSkip = document.getElementById('tutSkip');

  function say(html, ok) {
    tutBubble.innerHTML = html;
    tutBubble.classList.toggle('ok', !!ok);
    tutBubble.hidden = false;
  }
  function later(fn, ms) { tut.timers.push(setTimeout(fn, ms)); }

  // 화면 안을 천천히 날며 벽에 튕기는 왝슨 (말풍선 아래 영역에서만)
  function tutBird(size, speed) {
    var W = stage.clientWidth, H = stage.clientHeight;
    var x = rand(W * 0.15, W * 0.85 - size);
    var y = rand(H * 0.4, H * 0.85 - size);
    var a = rand(0, Math.PI * 2);
    var b = createBird(size, x, y, normalize(Math.cos(a), Math.sin(a) * 0.5), speed, true);
    b.amp = rand(4, 10); b.curveAmp = rand(6, 14);   // 느린 만큼 흔들림도 작게
    b.minY = H * 0.32;
    return b;
  }

  function tutTick() {
    var ts = performance.now();
    var dt = Math.min(50, ts - tut.lastTs) / 1000;
    tut.lastTs = ts;
    var W = stage.clientWidth, H = stage.clientHeight;
    var live = birds.filter(function (b) { return b.alive; });
    live.forEach(function (b) {
      b.t += dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx); }
      if (b.x > W - b.size) { b.x = W - b.size; b.vx = -Math.abs(b.vx); }
      if (b.y < b.minY) { b.y = b.minY; b.vy = Math.abs(b.vy); }
      if (b.y > H - b.size - 10) { b.y = H - b.size - 10; b.vy = -Math.abs(b.vy); }
      draw(b);
    });
  }

  function tutStart() {
    if (playing) return;
    tutStop();
    document.getElementById('startOverlay').hidden = true;
    document.getElementById('endOverlay').hidden = true;
    tut.active = true;
    tutSkip.hidden = false;
    tut.lastTs = performance.now();
    tut.loopId = setInterval(tutTick, 1000 / 60);
    tutStep1();
  }

  function tutStep1() {
    tut.step = 1;
    say('<span class="step">STEP 1 / 3</span>날아다니는 <b>왝슨</b>을 <b>클릭</b>해서 잡아 보세요!');
    tutBird(100, 110);
  }
  function tutStep2() {
    tut.step = 2;
    say('<span class="step">STEP 2 / 3</span><b>작은 왝슨일수록 점수가 높아요.</b> 3마리를 모두 잡아 보세요!<br>'
      + '<span class="sub">작은 왝슨 +200 · 중간 +150 · 큰 왝슨 +100</span>');
    tutBird(50, 150); tutBird(78, 130); tutBird(104, 110);
  }
  function tutStep3() {
    tut.step = 3;
    say('<span class="step">STEP 3 / 3</span>이번엔 <b>빈 곳</b>(점선 원)을 클릭해 보세요.');
    tutTarget.hidden = false;
    var r = tutTarget.getBoundingClientRect();
    tutHand.style.transform = 'translate(' + (r.left + r.width * 0.5) + 'px,' + (r.top + r.height * 0.5) + 'px)';
    tutHand.hidden = false;
  }

  function tutCatch(b, cx, cy) {
    if (tut.step !== 1 && tut.step !== 2) return;
    catchBird(b, cx, cy);
    if (tut.step === 1) {
      tut.step = 1.5;
      say('잘했어요! 이렇게 <b>클릭하면 포획</b>돼요.', true);
      later(tutStep2, 1500);
    } else if (!birds.some(function (x) { return x.alive; })) {
      tut.step = 2.5;
      say('완벽해요! 작은 왝슨을 노리면 <b>점수</b>가 쭉쭉 올라요.', true);
      later(tutStep3, 1700);
    }
  }

  function tutMiss() {
    if (tut.step === 3) {
      tut.step = 3.5;
      tutTarget.hidden = true; tutHand.hidden = true;
      say('빗나갔어요! 그래도 <b>감점은 없어요.</b> 단, 명중률은 떨어져요.', true);
      later(tutFinish, 1900);
    } else if (tut.step === 1 || tut.step === 2) {
      say('<span class="step">STEP ' + tut.step + ' / 3</span>아쉽게 빗나갔어요. <b>왝슨 몸통</b>을 정확히 클릭해 보세요!');
    }
  }

  function tutFinish() {
    tutStop();
    document.getElementById('tutEndOverlay').hidden = false;
  }

  // 게임방법 상태를 모두 정리하고 점수판을 초기화한다
  function tutStop() {
    tut.active = false;
    tut.step = 0;
    clearInterval(tut.loopId);
    tut.timers.forEach(clearTimeout); tut.timers = [];
    birds.slice().forEach(removeBird);
    score = 0; caught = 0; misses = 0; timeLeft = GAME_SECONDS;
    updateHud(GAME_SECONDS);
    [tutBubble, tutHand, tutTarget, tutSkip].forEach(function (el) { el.hidden = true; });
    document.getElementById('tutEndOverlay').hidden = true;
  }

  document.getElementById('howtoBtn').addEventListener('click', tutStart);
  document.getElementById('tutAgainBtn').addEventListener('click', tutStart);
  document.getElementById('tutHomeBtn').addEventListener('click', function () {
    tutStop();
    document.getElementById('startOverlay').hidden = false;
  });
  document.getElementById('tutStartBtn').addEventListener('click', start);
  tutSkip.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  tutSkip.addEventListener('click', tutFinish);

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);
})();
</script>
</body>
</html>
